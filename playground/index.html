<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SeeDS — Playground Mode</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <link rel="stylesheet" href="./styles/playground.css" />
  <link rel="stylesheet" href="./styles/bricks.css" />
  <link rel="stylesheet" href="./styles/hovercard.css" />
</head>
<body>

  <!-- THE THREE-PANEL LAYOUT -->
  <div id="pg-shell">

    <!-- 20% — Brick Library -->
    <div id="brick-panel">
      <div id="ds-selector">
        <!-- DS picker buttons rendered by BrickPanel.js -->
      </div>
      <div id="brick-list">
        <!-- Individual brick buttons rendered by BrickPanel.js -->
      </div>
    </div>

    <!-- 30% — Live Code Panel -->
    <div id="code-panel">
      <!-- Code blocks rendered by CodePanel.js -->
    </div>

    <!-- 50% — 3D Canvas -->
    <div id="canvas-area">
      <canvas id="pg-canvas"></canvas>
    </div>

  </div><!-- /pg-shell -->

  <!-- Hover card — singleton, hidden by default -->
  <div id="hover-card" class="hover-card">
    <div class="hc__title"></div>
    <div class="hc__body"></div>
    <div class="hc__code"><pre></pre></div>
    <div class="hc__deps"></div>
    <div class="hc__scene"></div>
  </div>

  <script type="module" src="./src/core/PlaygroundApp.js"></script>
</body>
</html>
