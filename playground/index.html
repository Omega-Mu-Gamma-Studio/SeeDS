<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SeeDS — Playground Mode</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <link rel="stylesheet" href="./styles/playground.css" />
  <link rel="stylesheet" href="./styles/bricks.css" />
  <link rel="stylesheet" href="./styles/hovercard.css" />
  <link rel="stylesheet" href="./styles/themes.css" />
</head>
<body>

  <a id="pg-back" href="../index.html" title="Back to SeeDS">← SeeDS</a>

  <div id="pg-shell">

    <!-- 20% — Brick palette -->
    <div id="brick-panel">
      <div id="ds-selector"></div>
      <div id="brick-list"></div>
    </div>

    <!-- 30% — Work panel (Build tab + Code tab) -->
    <div id="work-panel">

      <!-- Tab bar -->
      <div id="work-tabs">
        <button class="work-tab work-tab--active" data-tab="build" type="button">Build</button>
        <button class="work-tab" data-tab="code" type="button">Code</button>
        <button id="reset-btn" type="button" title="Clear chain">↺ Reset</button>
      </div>

      <!-- Build tab -->
      <div id="tab-build" class="tab-pane tab-pane--active">
        <div id="build-canvas">
          <div id="chain-list"></div>
          <div id="drop-zone" class="drop-zone">
            <span class="drop-zone__hint">drag a brick here</span>
          </div>
        </div>
      </div>

      <!-- Code tab -->
      <div id="tab-code" class="tab-pane">
        <div id="code-panel"></div>
      </div>

    </div>

    <!-- 50% — 3D Canvas -->
    <div id="canvas-area">
      <canvas id="pg-canvas"></canvas>
    </div>

  </div>

  <!-- Hover card -->
  <div id="hover-card" class="hover-card">
    <div class="hc__title"></div>
    <div class="hc__body"></div>
    <div class="hc__code"><pre></pre></div>
    <hr class="hc__divider">
    <div class="hc__deps"></div>
    <div class="hc__scene"></div>
  </div>


  <div id="build-canvas">
  <div id="chain-list"></div>
  <div id="drop-zone-connector" class="chain-connector"></div>
  <div id="drop-zone" class="drop-zone">
    <span class="drop-zone__hint">drag a brick here</span>
  </div>
  </div>


  <script type="module" src="./src/core/PlaygroundApp.js"></script>
</body>
</html>
